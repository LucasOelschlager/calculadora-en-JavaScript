<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>Vite App</title>
  </head>
  <body>
    <div class="cal-container">
      <h1>CALCULADORA JS</h1>
      <div class="calc-body">
        <div class="calc-output">
          <input type="text" name="" id="">
        </div>
        <div class="calc-operations">  
          <div class="grid-container">
            <button class="grid-item" id="MC">MC</button>
            <button class="grid-item" id="MR">MR</button>
            <button class="grid-item" id="M-">M-</button>
            <button class="grid-item" id="M+">M+</button>
            <button class="grid-item" id="(">(</button>
            <button class="grid-item" id=")">)</button>
            <button class="grid-item" id="operadorRaiz">√</button>
            <button class="grid-item" id="7">7</button>
            <button class="grid-item" id="8">8</button>
            <button class="grid-item" id="9">9</button>
            <button class="grid-item" id="÷">÷</button>
            <button class="grid-item" id="%">%</button>
            <button class="grid-item" id="→">→</button>
            <button class="grid-item" id="4">4</button>
            <button class="grid-item" id="5">5</button>
            <button class="grid-item" id="6">6</button>
            <button class="grid-item" id="X">X</button>
            <button class="grid-item" id="-">-</button>
            <button class="grid-item" id="AC">AC</button>
            <button class="grid-item" id="1">1</button>
            <button class="grid-item" id="2">2</button>
            <button class="grid-item" id="3">3</button>
            <button class="grid-item" id="operadorMas">+</button>
            <button class="grid-item" id="operadorIgual">=</button>
            <button class="grid-item" id="C">C</button>
            <button class="grid-item" id="0">0</button>
            <button class="grid-item" id="00">00</button>
            <button class="grid-item" id="operadorPunto">.</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <script type="module" src="src/scripts/app.js"></script>
    <title>Vite App</title>
  </head>
  <body>
    <div class="cal-container">
      <h1>CALCULADORA JS</h1>
      <div class="calc-body">
        <div class="calc-output">
          <input type="text" value="0" id="calc-output">
        </div>
        <div class="calc-operations">  
          <div class="grid-container" id="buttons">
            <button class="grid-item btn-mc" id="MC">MC</button>
            <button class="grid-item btn-mr" id="MR">MR</button>
            <button class="grid-item btn-m-" id="M-">M-</button>
            <button class="grid-item btn" id="M+">M+</button>
            <button class="grid-item btn" id="(">(</button>
            <button class="grid-item btn" id=")">)</button>
            <button class="grid-item btn" id="operadorRaiz">√</button>
            <button class="grid-item btn" id="7">7</button>
            <button class="grid-item btn" id="8">8</button>
            <button class="grid-item btn" id="9">9</button>
            <button class="grid-item btn" id="÷">÷</button>
            <button class="grid-item btn" id="%">%</button>
            <button class="grid-item btn-delete" id="del">DEL</button>
            <button class="grid-item btn" id="4">4</button>
            <button class="grid-item btn" id="5">5</button>
            <button class="grid-item btn" id="6">6</button>
            <button class="grid-item btn" id="X">X</button>
            <button class="grid-item btn" id="-">-</button>
            <button class="grid-item btn-ac" id="AC">AC</button>
            <button class="grid-item btn" id="1">1</button>
            <button class="grid-item btn" id="2">2</button>
            <button class="grid-item btn" id="3">3</button>
            <button class="grid-item btn" id="operadorMas">+</button>
            <button class="grid-item btn-equal" id="operadorIgual">=</button>
            <button class="grid-item btn-c" id="C">C</button>
            <button class="grid-item btn" id="0">0</button>
            <button class="grid-item btn" id="00">00</button>
            <button class="grid-item btn" id="operadorPunto">.</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
